[project]
name = "subforge"
dynamic = ["version"]
description = "AI-powered speech transcription, subtitle optimization, and translation"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "Weifeng" }]
requires-python = ">=3.10,<3.13"
keywords = ["video", "caption", "subtitle", "asr", "llm", "translation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "requests>=2.32.4",
    "openai>=1.97.1",
    "anthropic>=0.75.0",
    "diskcache>=5.6.3",
    "yt-dlp>=2025.7.21",
    "json-repair>=0.49.0",
    "langdetect>=1.0.9",
    "pydub>=0.25.1",
    "tenacity>=8.2.0",
    "platformdirs>=4.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "modelscope>=1.32.0",
    "psutil>=7.0.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "colorama>=0.4.6; platform_system == 'Windows'",
    "python-multipart>=0.0.29",
    "websockets>=16.0",
    "pydantic>=2.12.5",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
denoise = [
    "deepfilternet==0.5.6",
    "soundfile>=0.12.1,<0.13",
    "torch==2.8.0",
    "torchaudio==2.8.0",
]
faster-whisper = [
    "faster-whisper>=1.2.1,<2",
]
whisperx = [
    "mlx-whisper>=0.4.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "whisperx>=3.8.6,<3.9.0",
    "pyannote.audio>=4.0,<5",
    "onnxruntime>=1.19,<2",
    "transformers>=4.37,<5",
]

[project.urls]
Homepage = "https://github.com/henry1786580051-lang/SubForge"
Repository = "https://github.com/henry1786580051-lang/SubForge"
Issues = "https://github.com/henry1786580051-lang/SubForge/issues"

[project.scripts]
subforge = "subforge.cli.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0-dev"

[tool.hatch.build.hooks.vcs]
version-file = "subforge/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "docs/",
    "legacy-docs/",
    "work-dir/",
    "AppData/",
    "output/",
    "scripts/",
    "tests/",
    ".github/",
]

[tool.hatch.build.targets.wheel]
packages = ["subforge"]

[tool.hatch.build.targets.wheel.force-include]
"resource/assets" = "subforge/resources/assets"
"resource/ten_vad" = "subforge/resources/ten_vad"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
override-dependencies = [
    # DeepFilterNet 0.5.6 declares numpy<2, but its inference path works with
    # NumPy 2.x. WhisperX 3.8.6 requires NumPy >=2.1.
    "numpy>=2.1,<3",
]

[dependency-groups]
dev = [
    "numpy>=2.1,<3",
    "soundfile>=0.12.1,<0.13",
    "pyright>=1.1.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "modelscope>=1.32.0",
    "psutil>=7.0.0",
    "pyinstaller>=6.20.0",
    "dmgbuild>=1.6.7",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["subforge"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "work-dir",
    "AppData",
    "resource",
    "**/node_modules"
]
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportGeneralTypeIssues = false
reportOptionalOperand = "warning"
reportOptionalMemberAccess = false
reportArgumentType = "warning"
reportCallIssue = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short --disable-warnings"
markers = [
    "integration: Integration tests that require external services",
    "slow: Slow running tests",
    "llm: Tests that require LLM API access",
    "translator: Tests for translation modules",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
