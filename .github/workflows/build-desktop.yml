name: Build Desktop Apps

on:
  pull_request:
    paths:
      - "subforge/**"
      - "backend/**"
      - "frontend/**"
      - "resource/**"
      - "launcher.py"
      - "build_macos.py"
      - "scripts/build_desktop.py"
      - "scripts/smoke_desktop.py"
      - "SubForge.spec"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-desktop.yml"
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            uv-extra: "--extra denoise"
          - name: macOS Intel
            os: macos-15-intel
            uv-extra: ""

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.10.11"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync --frozen ${{ matrix.uv-extra }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build desktop bundle
        run: uv run ${{ matrix.uv-extra }} --with pyinstaller --with static-ffmpeg --with pywebview python scripts/build_desktop.py --clean

      - name: Smoke test packaged app
        run: uv run python scripts/smoke_desktop.py dist/SubForge

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (uv run python -c "from subforge.config import VERSION; print(VERSION)").Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "scripts\windows_installer.iss"

      - name: Smoke test installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item artifacts\*-setup.exe
          $installDir = Join-Path $env:RUNNER_TEMP "SubForge-installed"
          Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait
          uv run python scripts/smoke_desktop.py $installDir

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          if [ "$RUNNER_OS" = "Windows" ]; then
            gh release upload "$TAG" artifacts/*-setup.exe --clobber
          fi
