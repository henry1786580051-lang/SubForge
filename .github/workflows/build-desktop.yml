name: Build Desktop Apps

on:
  pull_request:
    paths:
      - "subforge/**"
      - "backend/**"
      - "frontend/**"
      - "resource/**"
      - "launcher.py"
      - "build_macos.py"
      - "scripts/build_desktop.py"
      - "scripts/smoke_desktop.py"
      - "scripts/windows_installer.iss"
      - "SubForge.spec"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-desktop.yml"
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Existing release version to rebuild (for example, 1.1.6)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            uv-extra: "--extra denoise --extra whisperx"
            artifact-name: desktop-Windows
            build-flavor: ""
            cuda: false
          - name: macOS Intel
            os: macos-15-intel
            uv-extra: ""
            artifact-name: desktop-macOS-intel
            build-flavor: ""
            cuda: false
          - name: macOS Apple Silicon
            os: macos-15
            uv-extra: "--extra denoise --extra whisperx"
            artifact-name: desktop-macOS-arm64
            build-flavor: ""
            cuda: false

    env:
      SUBFORGE_BUILD_FLAVOR: ${{ matrix.build-flavor }}
      SUBFORGE_BUILD_VERSION: ${{ inputs.release_version || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.10.11"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync --frozen ${{ matrix.uv-extra }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build desktop bundle
        run: uv run --no-sync ${{ matrix.uv-extra }} --with pyinstaller --with pywebview python scripts/build_desktop.py --clean

      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: uv run --no-sync python scripts/smoke_desktop.py dist/SubForge.app

      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        run: uv run --no-sync python scripts/smoke_desktop.py dist/SubForge

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = if ($env:SUBFORGE_BUILD_VERSION) {
            $env:SUBFORGE_BUILD_VERSION.Trim().TrimStart("v")
          } else {
            (uv run --no-sync python -c "from subforge.config import VERSION; print(VERSION)").Trim()
          }
          $suffix = if ($env:SUBFORGE_BUILD_FLAVOR) { "-$($env:SUBFORGE_BUILD_FLAVOR)" } else { "" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "/DMyAppSuffix=$suffix" "/DMyCompression=lzma2/ultra64" "/DMyDiskSpanning=no" "scripts\windows_installer.iss"

      - name: Smoke test installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item artifacts\*-setup.exe
          $installDir = Join-Path $env:RUNNER_TEMP "SubForge-installed"
          Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait
          uv run --no-sync python scripts/smoke_desktop.py $installDir

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/*-setup-*.bin
          if-no-files-found: error
          retention-days: 14

      - name: Upload to GitHub Release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES=".github/release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --verify-tag --draft --title "SubForge $TAG" --notes-file "$NOTES"
            else
              gh release create "$TAG" --verify-tag --draft --title "SubForge $TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" artifacts/*-setup.exe --clobber
